# Grading rubric — 6 signals, 10 points. Published verbatim on the Substack About page.
# The AI fills the first five from GitHub data and the README; Tyler fills "fit" after the test run.
publication:
  name: "Top 3 Repos"
  author: "Tyler Reynolds"
  handle: "hoodlem4real"
  subdomain: "hoodlem4real"
  url: "https://hoodlem4real.substack.com"
  section: "Top 3 Repos"      # Substack section the daily issue is filed under (others: "Deep Dives", "Adopted")
  repo_url: "https://github.com/treycsa/tylers-substack/blob/main/"   # where test receipts live; change owner if different
  timezone: "America/Los_Angeles"
  publish_hour_local: 6

# Where candidates come from. No LinkedIn: hosted trending feeds + the GitHub Search API only.
discover:
  feeds:   # GitHubTrendingRSS (github.com/mshibanami/GitHubTrendingRSS); pattern .../daily/<language>.xml
    - "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"
    - "https://mshibanami.github.io/GitHubTrendingRSS/daily/python.xml"
    - "https://mshibanami.github.io/GitHubTrendingRSS/daily/typescript.xml"
  search:  # GET /search/repositories q="created:>{today-days_back} stars:>={min_stars} [language:X]"
    days_back: 7
    min_stars: 50
    languages: []   # empty = one unfiltered query; e.g. [python, typescript] = one query per language
  linkedin:  # optional, owner's own logged-in session over CDP; see README "LinkedIn discovery"
    mode: search          # search = content search for `query` (most repo posts); feed = home feed
    query: "github.com"
    date_posted: past-24h # or past-week
    scrolls: 8            # human cadence; hard cap 30

selection:
  candidates_to_score: 10     # AI scores this many after dedupe
  candidates_to_test: 5       # Tyler runs the quickstart on this many
  picks: 3                    # published per issue
  dedupe_window_days: 30      # a repo scored in this window is skipped unless it shipped a major release
  min_stars_without_override: 50
  fail_install_cap: 6.0       # a repo that fails "runs out of the box" cannot score above this

signals:
  traction:
    weight: 2.0
    description: "Stars gained in the last 7 days vs. repo age; forks; unique committers"
  maintenance:
    weight: 1.5
    description: "Commits in last 30 days, open-issue response time, CI passing, releases tagged"
  runs_out_of_box:
    weight: 2.0
    description: "Install + quickstart succeeds in a clean container within 10 minutes"
  novelty:
    weight: 1.5
    description: "Does something the obvious incumbent (LangChain / LiteLLM / etc.) does not"
  license_safety:
    weight: 1.0
    description: "OSI license, no telemetry surprises, no secrets in history, sane dependency count"
  fit:
    weight: 2.0
    description: "Would it survive in a real production codebase (AlgoChains services or comparable)"

labels:
  - ADOPTED
  - "TRIED, NOT ADOPTED"
  - WATCHING

test:
  timeout_seconds: 600
  docker_image: "python:3.11-slim"
