[project]
name = "substack-pipeline"
version = "0.1.0"
description = "Daily Top-3 GitHub repo review pipeline for Tyler's Substack: ingest LinkedIn posts, enrich, score, test, review, publish."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
substack = "substack_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
testpaths = ["tests"]
pythonpath = ["src"]
